      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit titles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          conventional='^[a-zA-Z][a-zA-Z0-9-]*(\([^()[:space:]][^()]*\))?!?: [^[:space:]]'
          commits=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          invalid=0
          for commit in $commits; do
            message=$(git show -s --format=%B "$commit")
            subject=${message%%$'\n'*}
            if [[ ! $subject =~ $conventional ]]; then
              echo "::error::Commit ${commit:0:7} must use a Conventional Commit title, e.g. feat(hunt): add a new hunt."
              invalid=1
            fi
          done
          exit "$invalid"
