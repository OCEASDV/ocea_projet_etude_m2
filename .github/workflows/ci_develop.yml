name: Build Develop
on:
  pull_request:
    branches:
      - develop
jobs:
  checks :
    name: Checks conventional PR title
    runs-on: 
      - windows-latest
      - ubuntu-latest
      - macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --watchAll=false