name: Build Develop
on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        if: hashFiles('package.json') != ''
        with:
          node-version: 24
          cache: npm
      - name: Lint, typecheck and test
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run lint
          npx --no-install tsc --noEmit
          npm test -- --watchAll=false
